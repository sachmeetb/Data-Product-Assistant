[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airetail-data-agent"
version = "1.0.0"
description = "AI Retail Data Agent — FastAPI backend with multi-agent pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Pre-release package — install separately with: pip install --pre agent-framework-anthropic
    "agent-framework-anthropic",
    "requests>=2.31.0",
    "azure-identity==1.25.3",
    "azure-monitor-opentelemetry==1.8.7",
    "azure-core==1.39.0",
    "python-dotenv==1.2.2",
    "fastapi==0.136.0",
    "uvicorn[standard]==0.45.0",
    "gunicorn==25.3.0",
    "aiofiles==25.1.0",
    "opentelemetry-api>=1.20.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
# `agent-framework-anthropic` is a pre-release package; allow uv to resolve
# pre-release versions so `uv lock` / `uv sync` can install it.
prerelease = "allow"
