steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO_NAME}/dp-assistant-v2-backend:$BUILD_ID'
      - '.'
    dir: 'backend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO_NAME}/dp-assistant-v2-backend:$BUILD_ID'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO_NAME}/dp-assistant-v2-backend:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--concurrency=80'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=${_PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_REGION},GOOGLE_GENAI_LOCATION=global,GOOGLE_GENAI_USE_VERTEXAI=1,GCS_TEMPLATES_BUCKET=${_TEMPLATES_BUCKET},GCS_UPLOADS_BUCKET=${_UPLOADS_BUCKET},BQ_PROJECT=${_PROJECT_ID},BQ_LOCATION=${_REGION},BQ_DATASET_GOLD=gold,BQ_DATASET_SILVER=silver,BQ_DATASET_BRONZE=bronze,CORS_ORIGINS=${_CORS_ORIGINS}'
      - '--service-account=dp-assistant-sa@${_PROJECT_ID}.iam.gserviceaccount.com'
      - '--allow-unauthenticated'

substitutions:
  _SERVICE_NAME: dp-assistant-v2-backend
  _REGION: us-central1
  _PROJECT_ID: ''
  _REPO_NAME: dp-assistant
  _TEMPLATES_BUCKET: dp-assistant-templates
  _UPLOADS_BUCKET: dp-assistant-uploads
  _CORS_ORIGINS: ''    # set via --substitutions after frontend is deployed

options:
  logging: CLOUD_LOGGING_ONLY
