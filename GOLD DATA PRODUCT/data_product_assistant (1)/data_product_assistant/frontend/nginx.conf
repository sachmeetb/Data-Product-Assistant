server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Handle POST requests to static SPA routes without 405
    error_page 405 =200 /index.html;

    # Proxy API calls directly to the yk-gold entrypoint so direct frontend visits work
    location /__api/ {
        proxy_pass https://yk-gold-a74bkpgdzq-uc.a.run.app/__api/;
        proxy_ssl_server_name on;
        proxy_set_header Host yk-gold-a74bkpgdzq-uc.a.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache for hashed assets
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No-cache for index.html so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
