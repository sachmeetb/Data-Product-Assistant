<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accenture · Data Product Assistant</title>

  <!-- Inter font — matches the prototype's typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind Play CDN — utilities only. Preflight is DISABLED so it does not
       reset the app's existing markdown/card CSS in src/index.css. The prototype
       we mirror uses mostly explicit inline styles, so utilities-without-reset
       reproduces its look without disturbing anything already working. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { corePlugins: { preflight: false } };
  </script>

  <!-- lucide icons (UMD) — same icon set + version the prototype uses -->
  <script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
