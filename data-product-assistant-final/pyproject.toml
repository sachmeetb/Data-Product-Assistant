[project]
name = "data-product-assistant-final"
version = "0.1.0"
description = "Cross-domain agentic data product assistant on Azure Databricks"
requires-python = ">=3.11"

dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "databricks-sdk>=0.38",
    "databricks-sql-connector>=3.6",
    "openai>=1.50",
    "azure-identity>=1.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools]
packages = ["core", "packs", "agents", "bronze", "pipelines", "api"]
