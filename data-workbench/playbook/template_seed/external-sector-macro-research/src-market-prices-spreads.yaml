  physicalName: market_prices_spreads
  physicalType: table
  description: Normalized feed of market quotes and reference curves used for FX/interest-rate
    pass-through, BoP valuation effects, reserves analytics, and policy monitoring.
    Includes spot/forward FX, rates (OIS/IRS/bonds/bills), equities/commodities where
    relevant, and CDS spreads.
  properties:
