    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: bid
    physicalName: bid
    logicalName: Bid
    logicalType: varchar
    physicalType: varchar
    description: Best buyer price quoted for the instrument at the time of capture.
