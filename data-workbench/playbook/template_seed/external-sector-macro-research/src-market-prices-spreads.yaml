    physicalName: isin_ticker
    logicalName: Isin Ticker
    logicalType: varchar
    physicalType: varchar
    description: International Securities Identification Number or exchange ticker
      symbol uniquely identifying the financial instrument.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: cfi
    physicalName: cfi
    logicalName: Cfi
    logicalType: varchar
    physicalType: varchar
