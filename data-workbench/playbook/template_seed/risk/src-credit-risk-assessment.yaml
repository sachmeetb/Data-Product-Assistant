    required: true
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: customer_id
    physicalName: customer_id
    logicalName: Customer ID
    logicalType: bigint
    physicalType: bigint
    description: Unique identifier of the borrower whose credit risk is being assessed,
      linking to the customer master.
    primaryKey: true
    required: true
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: score_value
    physicalName: score_value
    logicalName: Score Value
    logicalType: numeric
    physicalType: numeric
    description: Numeric credit score assigned to the borrower by the scoring model
