    primaryKey: false
    required: true
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: rating_valid_till
    physicalName: rating_valid_till
    logicalName: Rating Valid Till
    logicalType: varchar
    physicalType: varchar
