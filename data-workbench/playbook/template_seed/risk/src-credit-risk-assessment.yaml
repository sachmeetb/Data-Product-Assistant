apiVersion: v3.1.0
kind: DataContract
id: template:risk:src-credit-risk-assessment
name: Credit Risk Assessment
version: 1.0.0
status: draft
domain: Risk
description: Borrower-level credit scoring, rating history, and overrides
schema:
