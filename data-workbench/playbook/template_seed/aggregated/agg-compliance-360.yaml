customProperties:
  feasibility:
    schema_version: '1.0'
    spec_classification: confidential
    cadence: ''
    freshness_history: scd2
    freshness_description: ''
    grain_keys:
    - customer_id
    grain_description: ''
    allowed_derivations:
    - rename
    - cast
    composition:
      join_keys:
      - customer_id
      - account_id
      composed_of:
      - src_customer_data_product
      - src_payments_data_product
      - src_transaction_master
      - src_trade_finance
      - src_open_banking
      - src_contact_center_interactions
      - src_external_claims_liabilities
      - src_balance_of_payment
      description: Assembled by joining the composing source products on shared identity
        keys.
    attr_derivations:
      amount:
      - currency_normalize
      p2p_or_p2m_amount_transactions:
      - currency_normalize
      charges:
      - currency_normalize
      available_balance:
      - currency_normalize
      current_balance:
      - currency_normalize
      refund_amount:
      - currency_normalize
      net_amount:
      - currency_normalize
