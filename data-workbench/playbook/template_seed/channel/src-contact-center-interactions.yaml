apiVersion: v3.1.0
kind: DataContract
id: template:channel:src-contact-center-interactions
name: Contact Center Interactions
version: 1.0.0
status: draft
domain: Channel
description: Call logs, IVR paths, agent notes, complaint tickets, authentication
  steps.
schema:
- name: Contact Center Interactions
  physicalName: contact_center_interactions
  physicalType: table
  description: Call logs, IVR paths, agent notes, complaint tickets, authentication
    steps.
  properties:
  - name: interaction_id
    physicalName: interaction_id
    logicalName: Interaction ID
    logicalType: bigint
    physicalType: bigint
    description: Unique identifier for a single contact center interaction (call,
      chat, or other channel contact), serving as the primary key for the interaction
      record.
    primaryKey: true
    required: true
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: customer_id
    physicalName: customer_id
    logicalName: Customer ID
    logicalType: bigint
    physicalType: bigint
    description: The bank customer identifier linking the interaction to the caller's
      profile and account history.
    primaryKey: true
    required: true
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: channel
    physicalName: channel
    logicalName: Channel
    logicalType: varchar
    physicalType: varchar
    description: The medium through which the interaction occurred, such as inbound_call,
      outbound_call, web_chat, or secure_message.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: start_ts
    physicalName: start_ts
    logicalName: Start Ts
    logicalType: timestamp
    physicalType: timestamp
    description: The timestamp when the contact center interaction began, used for
      measuring handle time and session duration.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: end_ts
    physicalName: end_ts
    logicalName: End Ts
    logicalType: timestamp
    physicalType: timestamp
    description: The timestamp when the contact center interaction concluded, used
      alongside start_ts to compute average handle time.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: ivr_path
    physicalName: ivr_path
    logicalName: Ivr Path
    logicalType: varchar
    physicalType: varchar
    description: The sequence of IVR menu options navigated by the customer before
      reaching an agent or completing self-service.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: queue
    physicalName: queue
    logicalName: Queue
    logicalType: varchar
    physicalType: varchar
    description: The routing queue or skill group to which the interaction was directed,
      indicating the service category or team.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: aht_seconds
    physicalName: aht_seconds
    logicalName: Aht Seconds
    logicalType: varchar
    physicalType: varchar
    description: Average handle time in seconds for the interaction, encompassing
      talk time, hold time, and after-call work.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: wrap_code
    physicalName: wrap_code
    logicalName: Wrap Code
    logicalType: varchar
    physicalType: varchar
    description: The post-call disposition code entered by the agent summarising the
      nature and outcome of the interaction.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: language
    physicalName: language
    logicalName: Language
    logicalType: varchar
    physicalType: varchar
    description: The language spoken or selected by the customer during the interaction.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: transcript_id
    physicalName: transcript_id
    logicalName: Transcript ID
    logicalType: bigint
    physicalType: bigint
    description: Unique identifier linking the interaction to its voice or chat transcript
      record for quality and compliance review.
    primaryKey: true
    required: true
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: case_id
    physicalName: case_id
    logicalName: Case ID
    logicalType: bigint
    physicalType: bigint
    description: Unique identifier for the complaint or service case raised during
      or as a result of this interaction.
    primaryKey: true
    required: true
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: category
    physicalName: category
    logicalName: Category
    logicalType: varchar
    physicalType: varchar
    description: The functional category of the complaint or case, such as billing_dispute,
      fraud, or product_enquiry.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: priority
    physicalName: priority
    logicalName: Priority
    logicalType: varchar
    physicalType: varchar
    description: The urgency classification of the case, determining the order and
      speed of resolution handling.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: sla_clock_start
    physicalName: sla_clock_start
    logicalName: Sla Clock Start
    logicalType: varchar
    physicalType: varchar
    description: The timestamp marking when the SLA resolution clock began for the
      associated complaint case.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: status
    physicalName: status
    logicalName: Status
    logicalType: varchar
    physicalType: varchar
    description: The current lifecycle state of the complaint case, such as open,
      in_progress, escalated, or resolved.
    primaryKey: false
    required: true
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: resolution_ts
    physicalName: resolution_ts
    logicalName: Resolution Ts
    logicalType: timestamp
    physicalType: timestamp
    description: The timestamp at which the complaint case was formally closed or
      resolved.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: root_cause_code
    physicalName: root_cause_code
    logicalName: Root Cause Code
    logicalType: varchar
    physicalType: varchar
    description: Standardised code identifying the underlying reason the customer's
      issue arose, used for root-cause analysis reporting.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: refund_amount
    physicalName: refund_amount
    logicalName: Refund Amount
    logicalType: numeric
    physicalType: numeric
    description: The monetary value of any refund or compensation authorised and processed
      as part of resolving the complaint.
    primaryKey: false
    required: true
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: agent_id
    physicalName: agent_id
    logicalName: Agent ID
    logicalType: bigint
    physicalType: bigint
    description: Unique identifier for the contact center agent who handled the interaction,
      used for performance and workload reporting.
    primaryKey: true
    required: true
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: team
    physicalName: team
    logicalName: Team
    logicalType: varchar
    physicalType: varchar
    description: The team or group to which the agent belongs within the contact center,
      such as a specialist unit or geographic cluster.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: skillset
    physicalName: skillset
    logicalName: Skillset
    logicalType: varchar
    physicalType: varchar
    description: The defined competency set assigned to the agent, determining which
      queue types and interaction categories they can handle.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: occupancy_rate
    physicalName: occupancy_rate
    logicalName: Occupancy Rate
    logicalType: numeric
    physicalType: numeric
    description: The proportion of the agent's logged-in time spent actively handling
      interactions, expressed as a percentage.
    primaryKey: false
    required: true
    criticalDataElement: false
    pii: false
    classification: pii
    examples: []
    logicalTypeOptions: {}
  - name: qa_score
    physicalName: qa_score
    logicalName: Qa Score
    logicalType: numeric
    physicalType: numeric
    description: The quality assurance score assigned to the interaction after evaluation
      against defined call quality criteria.
    primaryKey: false
    required: true
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: sentiment_score
    physicalName: sentiment_score
    logicalName: Sentiment Score
    logicalType: numeric
    physicalType: numeric
    description: A numeric measure of customer sentiment derived from interaction
      transcript or voice analysis, indicating satisfaction tone.
    primaryKey: false
    required: true
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: intent
    physicalName: intent
    logicalName: Intent
    logicalType: varchar
    physicalType: varchar
    description: The primary reason or goal the customer expressed during the interaction,
      as detected by NLP or agent classification.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: sensitivity
    physicalName: sensitivity
    logicalName: Sensitivity
    logicalType: varchar
    physicalType: varchar
    description: A flag or category indicating whether the interaction content involved
      sensitive topics such as bereavement, vulnerability, or financial hardship.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: keywords
    physicalName: keywords
    logicalName: Keywords
    logicalType: varchar
    physicalType: varchar
    description: Extracted terms from the interaction transcript that signal significant
      topics, products, or issues discussed.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: survey_id
    physicalName: survey_id
    logicalName: Survey ID
    logicalType: bigint
    physicalType: bigint
    description: Unique identifier for the post-interaction customer satisfaction
      survey administered after the call or case closure.
    primaryKey: true
    required: true
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: score
    physicalName: score
    logicalName: Score
    logicalType: numeric
    physicalType: numeric
    description: The numeric satisfaction score submitted by the customer in the post-interaction
      survey, typically on a scale of 1–10.
    primaryKey: false
    required: true
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  - name: verbatim
    physicalName: verbatim
    logicalName: Verbatim
    logicalType: varchar
    physicalType: varchar
    description: The customer's free-text comment provided alongside the survey score,
      capturing their qualitative feedback.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: pii
    examples: []
    logicalTypeOptions: {}
  - name: followup_needed_flag
    physicalName: followup_needed_flag
    logicalName: Followup Needed Flag
    logicalType: boolean
    physicalType: boolean
    description: Boolean indicator signalling that the interaction requires a follow-up
      action or callback before the case can be fully closed.
    primaryKey: false
    required: false
    criticalDataElement: false
    pii: false
    classification: internal
    examples: []
    logicalTypeOptions: {}
  foreignKeys: []
  transform:
    grouping_keys:
    - interaction_id
    scd_policy:
      type: latest_only
customProperties:
  feasibility:
    schema_version: '1.0'
    spec_classification: confidential
    cadence: ''
    freshness_history: current
    freshness_description: ''
    grain_keys:
    - interaction_id
    grain_description: ''
    allowed_derivations:
    - rename
    - cast
    composition:
      join_keys: []
      composed_of: []
      description: ''
productKind: source
sourceSpecId: src_contact_center_interactions
