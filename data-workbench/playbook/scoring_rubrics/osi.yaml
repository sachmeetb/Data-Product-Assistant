# OSI (Open Semantic Interchange) readiness rubric.
#
# Reproduces today's hardcoded WEIGHTS + per-criterion logic from osi.py.
# Weights sum to 100. N/A slots are removed from the total at scoring time so
# remaining weights re-normalise.
#
# This rubric runs the full OSI v0.1.1 translator + JSON-schema validator
# before scoring; conformance failure short-circuits the band to red
# regardless of completeness (see require_osi_conformance).

id: osi
label: OSI Readiness
short_label: OSI
description: |
  Open Semantic Interchange readiness — measures whether your product's
  contract carries enough semantic information that a downstream BI tool,
  AI agent, or pipeline can use it without back-channelling the producer.
  Bands: red below 50% (or any validation error), amber 50-79%, green 80%+.
empty_state_note: |
  Most source-aligned products land at 50-55% Amber until metrics and AI
  context are added — that's by design.

evaluator_version: osi-v0.1.1

band_thresholds:
  green: 80
  amber: 50

band_headlines:
  red: "Significant gaps before this product is semantically interchangeable"
  amber: "Workable but several OSI fields still missing"
  green: "Semantically ready for downstream BI / AI consumers"

# OSI rubric short-circuits to red on JSON-schema / uniqueness / reference /
# SQL-parseability errors emitted by validate_osi(). Other rubrics (ai_ready)
# set this false — they don't translate to an OSI doc and have no validator.
require_osi_conformance: true

# Whether translate_to_osi() must run before scoring. OSI predicates read
# from the translated dict; non-OSI rubrics can opt out.
requires_translation: true

# Optional LLM advisor invoked from /osi/evaluate after the deterministic
# score lands. Only OSI rubric ships an advisor in v1.
advisor:
  skill: data-product-osi-advisor
  timeout_seconds: 60
  applies_to_kinds: [osi_metric_create, osi_relationship_create, osi_ai_context_set]

criteria:
  - id: dataset_descriptions
    label: Dataset descriptions
    weight: 15
    predicate: osi_dataset_descriptions
    hint:
      pass:
        title: All datasets have descriptions.
      partial:
        title: Approve remaining table descriptions.
        detail: "Source products: Reviews → Tables (PO Validation panel). Consumer products: edit in wizard Step 5 (Product Details)."
      fail:
        title: Run metadata-enrichment, then approve table descriptions.
        detail: "Source products: Reviews → Tables. Consumer products: author the dataset description in wizard Step 5."

  - id: field_descriptions
    label: Field descriptions
    weight: 25
    predicate: osi_field_descriptions
    hint:
      pass:
        title: All fields have descriptions.
      partial:
        title: Approve remaining column descriptions.
        detail: "Reviews → Descriptions. Auto-generated by metadata-enrichment; PO confirms."
      fail:
        title: Run metadata-enrichment, then approve column descriptions.
        detail: "Reviews → Descriptions. Or use chat “Guide me” to draft them."

  - id: primary_keys
    label: Primary keys
    weight: 10
    predicate: osi_primary_keys
    hint:
      pass:
        title: Primary keys declared on all datasets.
      partial:
        title: Declare PKs on the remaining datasets.
        detail: "Source products: catalog :Column.primaryKey flags should propagate — re-run discovery if any are missing. Consumer products: pick PKs in wizard Step 4 (Shape the Schema)."
      fail:
        title: Declare a primary key for each dataset.
        detail: "Source products: re-run discovery if PKs were missed. Consumer products: pick in wizard Step 4 (Shape the Schema)."

  - id: rich_expressions
    label: Rich field expressions
    weight: 20
    predicate: osi_rich_expressions
    hint:
      pass:
        title: Most fields carry a non-trivial SQL expression.
      fail:
        title: No non-trivial SQL expressions authored yet.
        detail: "Engineer authors :ColumnMapping rows in the data_mapping stage with kinds like cast, concat, literal, case, arithmetic, lookup. Source products with 1:1 passthroughs only score low here by design."

  - id: relationships
    label: Relationships
    weight: 10
    predicate: osi_relationships
    hint:
      pass:
        title: FK relationships declared.
      fail:
        title: Declare at least one FK between your datasets.
        detail: "Source products: catalog FK discovery via :REFERENCES propagation; declare in :DataContractSchema.foreignKeys if discovery missed any. Consumer products: wizard Step 4, or accept the OSI advisor's osi_relationship_create Apply card from chat."
      na:
        title: Single-dataset model — relationships are N/A and don't penalise the score.

  - id: metrics
    label: Metrics
    weight: 10
    predicate: osi_metrics
    hint:
      pass:
        title: Metrics defined.
      fail:
        title: Add 1-3 business metrics (KPIs).
        detail: "Open the chat panel and ask “Help me improve my OSI score” — the advisor proposes sum / count / ratio metrics from your schema. Accept the osi_metric_create Apply card."

  - id: ai_context
    label: AI context
    weight: 10
    predicate: osi_ai_context
    hint:
      pass:
        title: AI context populated.
      fail:
        title: Set an AI context block.
        detail: "Open chat and ask “Help me improve my OSI score” — the advisor proposes synonyms, sample questions, and agent instructions. Accept the osi_ai_context_set Apply card."
