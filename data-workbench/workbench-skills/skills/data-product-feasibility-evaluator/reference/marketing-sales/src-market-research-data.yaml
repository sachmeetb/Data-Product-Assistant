spec_id: src_market_research_data
name: Market Research Data
domain: Marketing & Sales
product_kind: source
description: Normalized feed of competitor deposit product rates and offer terms (savings/current/term
  deposits) plus key benchmarks (policy/overnight). Used by the Deposit Pricing Engine
  and product teams to monitor market levels, detect changes, and set rates/offers
  by segment and region
schema_version: '1.0'
classification: internal
grain:
  keys:
  - study_id
  description: ''
freshness:
  history: snapshot
  cadence: ''
  description: ''
allowed_derivations:
- rename
- cast
attributes:
- name: study_id
  type: bigint
  concept: Study ID
  description: Unique identifier for a market research study or syndicated report covering competitor deposit rates and product terms.
  required: true
  is_key: true
  classification: internal
- name: provider
  type: varchar
  concept: Provider
  description: Name of the external research firm or data provider that conducted or supplied the market research study.
  required: false
  is_key: false
  classification: internal
- name: topic
  type: varchar
  concept: Topic
  description: Subject or thematic focus of the research study, such as deposit pricing, customer satisfaction, or product awareness.
  required: false
  is_key: false
  classification: internal
- name: date
  type: date
  concept: Date
  description: Publication or delivery date of the market research study.
  required: true
  is_key: false
  classification: internal
- name: markets
  type: varchar
  concept: Markets
  description: Geographic markets or countries covered by the research study.
  required: false
  is_key: false
  classification: internal
- name: fieldwork_start_end
  type: varchar
  concept: Fieldwork Start End
  description: Date range during which primary data collection or fieldwork was conducted for the study.
  required: false
  is_key: false
  classification: internal
- name: methodology
  type: varchar
  concept: Methodology
  description: Data collection methodology used in the study, such as telephone interview, online panel, or desk research.
  required: false
  is_key: false
  classification: internal
- name: sample_size
  type: numeric
  concept: Sample Size
  description: Number of respondents or observations included in the research study.
  required: false
  is_key: false
  classification: internal
- name: vendor
  type: varchar
  concept: Vendor
  description: External research vendor contracted to deliver fieldwork or data collection for the study.
  required: false
  is_key: false
  classification: internal
- name: segment_id
  type: bigint
  concept: Segment ID
  description: Unique identifier for a customer segment or respondent cohort defined within the research study.
  required: true
  is_key: true
  classification: internal
- name: name
  type: varchar
  concept: Name
  description: Name or label of the customer segment, such as mass affluent, SME, or first-time savers.
  required: true
  is_key: false
  classification: internal
- name: criteria
  type: varchar
  concept: Criteria
  description: Defining attributes or filters used to classify respondents into this market research segment.
  required: false
  is_key: false
  classification: internal
- name: survey_id
  type: bigint
  concept: Survey ID
  description: Unique identifier for an individual survey instrument or questionnaire administered within the research study.
  required: true
  is_key: true
  classification: internal
- name: method
  type: varchar
  concept: Method
  description: Mode of survey administration, such as CATI (computer-assisted telephone interviewing), CAWI (online), or face-to-face.
  required: false
  is_key: false
  classification: internal
- name: field_date
  type: date
  concept: Field Date
  description: Date on which a particular survey wave or fieldwork batch was conducted.
  required: true
  is_key: false
  classification: internal
- name: question_id
  type: bigint
  concept: Question ID
  description: Unique identifier for a specific survey question within the questionnaire.
  required: true
  is_key: true
  classification: internal
- name: response_id
  type: bigint
  concept: Response ID
  description: Unique identifier for an individual respondent's answer record for a specific survey question.
  required: true
  is_key: true
  classification: internal
- name: scale
  type: varchar
  concept: Scale
  description: Measurement scale used for the survey question, such as Likert 1-5, NPS 0-10, or binary yes/no.
  required: false
  is_key: false
  classification: internal
- name: coded_values
  type: numeric
  concept: Coded Values
  description: Numerically coded response values for a survey question, used for quantitative analysis and cross-tabulation.
  required: true
  is_key: false
  classification: internal
- name: weights
  type: varchar
  concept: Weights
  description: Statistical weighting factor applied to a respondent's data to make the sample representative of the target population.
  required: false
  is_key: false
  classification: internal
- name: ms_id
  type: bigint
  concept: Ms ID
  description: Unique identifier for a competitor market share or deposit rate observation record in the market sizing dataset.
  required: true
  is_key: true
  classification: internal
- name: geography
  type: varchar
  concept: Geography
  description: Geographic market or region to which a competitor rate or market share observation applies.
  required: false
  is_key: false
  classification: internal
- name: product
  type: varchar
  concept: Product
  description: Deposit product type for which a competitor rate or feature is being tracked (e.g. savings account, term deposit, current account).
  required: false
  is_key: false
  classification: internal
- name: value
  type: numeric
  concept: Value
  description: Numeric rate, market share, or metric value for the competitor product observed in this market research record.
  required: true
  is_key: false
  classification: internal
- name: period
  type: varchar
  concept: Period
  description: Reporting period (e.g. month, quarter) to which the competitor rate or market share observation relates.
  required: false
  is_key: false
  classification: internal
- name: provenance_source_reference
  type: varchar
  concept: Provenance Source Reference
  description: Reference or citation for the original source from which competitor rate or market data was collected.
  required: false
  is_key: false
  classification: internal
- name: last_collected_timestamp
  type: timestamp
  concept: Last Collected Timestamp
  description: Timestamp at which the competitor rate or market data was most recently collected or refreshed.
  required: false
  is_key: false
  classification: internal
- name: competitor_id
  type: bigint
  concept: Competitor ID
  description: Unique identifier for a competing financial institution tracked in the market research dataset.
  required: true
  is_key: true
  classification: internal
- name: metric
  type: varchar
  concept: Metric
  description: Name of the brand or perception metric being measured for the competitor (e.g. awareness, NPS, consideration, preference).
  required: false
  is_key: false
  classification: internal
- name: awareness
  type: varchar
  concept: Awareness
  description: Unaided or aided brand awareness score indicating the proportion of respondents familiar with the competitor.
  required: false
  is_key: false
  classification: internal
- name: consideration
  type: numeric
  concept: Consideration
  description: Proportion of respondents actively considering the competitor when selecting a deposit or financial product.
  required: false
  is_key: false
  classification: internal
- name: preference
  type: varchar
  concept: Preference
  description: Proportion of respondents preferring the competitor's product or brand over alternatives.
  required: false
  is_key: false
  classification: internal
- name: nps
  type: varchar
  concept: Nps
  description: Net Promoter Score for the competitor, measuring customer loyalty and likelihood to recommend.
  required: false
  is_key: false
  classification: internal
- name: purchase_intent
  type: varchar
  concept: Purchase Intent
  description: Proportion of respondents expressing intent to purchase or apply for a product from the competitor.
  required: false
  is_key: false
  classification: internal
