- name: device_type
  type: varchar
  concept: Device Type
  required: true
  is_key: false
  classification: internal
  description: Type of device used by the customer, such as smartphone, tablet, or desktop.
- name: app_name
  type: varchar
  concept: App Name
  required: true
  is_key: false
  classification: internal
  description: Name of the mobile or web application from which a customer interaction or transaction originated.
- name: settlement_date
  type: date
  concept: Settlement Date
  required: true
  is_key: false
  classification: internal
  description: Date on which a payment or trade was settled between counterparties.
- name: settlement_status
  type: varchar
  concept: Settlement Status
  required: true
  is_key: false
  classification: internal
  description: Status of a payment settlement, such as settled, pending, or failed.
- name: settlement_mode
  type: varchar
  concept: Settlement Mode
  required: false
  is_key: false
  classification: internal
  description: Mode of settlement for a payment, such as RTGS, NEFT, or SWIFT.
- name: reconciliation_status
  type: varchar
  concept: Reconciliation Status
  required: true
  is_key: false
  classification: internal
  description: Status of a reconciliation check between source and target records, such as matched or open.
- name: settlement_bank
  type: varchar
  concept: Settlement Bank
  required: false
  is_key: false
  classification: internal
  description: Bank responsible for settling funds in a payment clearing cycle.
- name: merchant_category_code
  type: varchar
  concept: Merchant Category Code
  required: false
  is_key: false
  classification: internal
  description: Four-digit ISO code identifying the category of goods or services offered by a merchant.
- name: source_and_destination_country
  type: numeric
  concept: Source And Destination Country
  required: false
  is_key: false
  classification: internal
  description: Countries of origin and destination for a cross-border payment or trade transaction.
- name: currency_pair
  type: varchar
  concept: Currency Pair
  required: true
  is_key: false
  classification: internal
  description: Two-currency combination for which an exchange rate is quoted, such as EUR/USD or GBP/INR.
- name: fx_rate
  type: numeric
  concept: FX Rate
  required: true
  is_key: false
  classification: internal
  description: Exchange rate applied to convert one currency to another in a transaction or valuation.
- name: purpose_code_education
  type: varchar
  concept: Purpose Code Education
  required: false
  is_key: false
  classification: internal
  description: Purpose code specific to education-related cross-border payments under foreign exchange regulations.
- name: family
  type: varchar
  concept: Family
  required: false
  is_key: false
  classification: internal
  description: Family grouping or household relationship classification of the customer.
- name: investment
  type: varchar
  concept: Investment
  required: false
  is_key: false
  classification: internal
  description: Value of capital investment made by an enterprise in fixed assets or financial instruments.
- name: exception_id
  type: bigint
  concept: Exception ID
  required: true
  is_key: true
  classification: internal
  description: Unique identifier for an exception or alert raised in a risk or compliance workflow.
- name: exception_type
  type: varchar
  concept: Exception Type
  required: true
  is_key: false
  classification: internal
  description: Classification of the exception by type, such as AML alert, limit breach, or data quality issue.
- name: raised_by
  type: varchar
  concept: Raised By
  required: false
  is_key: false
  classification: internal
  description: Identifier of the user or system that raised an alert, complaint, or exception.
- name: resolution_time
  type: varchar
  concept: Resolution Time
  required: false
  is_key: false
  classification: internal
  description: Time taken to resolve a complaint, case, or incident.
- name: resolution_outcome
  type: varchar
  concept: Resolution Outcome
  required: false
  is_key: false
  classification: internal
  description: Outcome of a resolved case, such as resolved in favour of customer or upheld.
- name: payment_purpose
  type: varchar
  concept: Payment Purpose
  required: false
  is_key: false
  classification: internal
  description: Declared purpose of a payment, used for AML screening and regulatory reporting.
- name: p2p_or_p2m_amount_transactions
  type: numeric
  concept: P2p Or P2m Amount Transactions
  required: true
  is_key: false
  classification: internal
  derivations:
  - currency_normalize
  description: Aggregated amount and count of peer-to-peer or peer-to-merchant payment transactions.
composition:
  composed_of:
  - src_secured_loans
  - src_unsecured_loans
  - src_credit_card
  - src_corporate_loans
  - src_transaction_master
  - src_payments_data_product
  join_keys:
  - customer_id
  - account_id
  description: Assembled by joining the composing source products on shared identity keys.
