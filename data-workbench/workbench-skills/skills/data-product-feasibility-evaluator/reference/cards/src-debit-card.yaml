spec_id: src_debit_card
name: Debit Card
domain: Cards
product_kind: source
description: Data on issued debit cards-linked accounts, usage limits, PIN status, transaction history, disputes, and chargebacks
  and card lifecycle with disputes and chargebacks
schema_version: '1.0'
classification: internal
grain:
  keys:
  - card_id
  description: ''
freshness:
  history: current
  cadence: ''
  description: ''
allowed_derivations:
- rename
- cast
attributes:
- name: card_id
  type: bigint
  concept: Card ID
  required: true
  is_key: true
  classification: internal
  description: Unique identifier for a payment card issued to a customer, serving as the primary key for all card-related
    records.
- name: card_type
  type: varchar
  concept: Card Type
  required: true
  is_key: false
  classification: internal
  description: Category of payment card by product tier or type, such as classic, gold, platinum, or corporate.
- name: card_status
  type: varchar
  concept: Card Status
  required: true
  is_key: false
  classification: internal
  description: Current status of the card, such as active, blocked, expired, or hotlisted.
- name: issue_date
  type: date
  concept: Issue Date
  required: true
  is_key: false
  classification: internal
  description: Date on which a card, bond, or document was issued.
- name: expiry_date
  type: date
  concept: Expiry Date
  required: true
  is_key: false
  classification: internal
  description: Date on which a card, offer, consent, or financial instrument expires and becomes invalid.
- name: usage_limit
  type: numeric
  concept: Usage Limit
  required: true
  is_key: false
  classification: internal
  description: Transactional usage limit set on a card, which may differ from the credit limit.
- name: account_id
  type: bigint
  concept: Account ID
  required: true
  is_key: true
  classification: internal
  description: Unique identifier for the bank account linked to a product or transaction, used as a join key to account-level
    records.
- name: account_type
  type: numeric
  concept: Account Type
  required: true
  is_key: false
  classification: internal
  description: Classification of the bank account by product category, such as savings, current, overdraft, or loan account.
- name: customer_id
  type: bigint
  concept: Customer ID
  required: true
  is_key: true
  classification: internal
  description: Unique numeric identifier for a customer record, serving as the primary join key across all customer-related
    entities.
- name: account_status
  type: numeric
  concept: Account Status
  required: true
  is_key: false
  classification: internal
  description: Current operational state of the bank account, such as active, dormant, closed, or frozen.
- name: account_balance
  type: numeric
  concept: Account Balance
  required: true
  is_key: false
  classification: internal
  description: Current net balance of the bank account, reflecting all posted credits and debits as of the reporting timestamp.
- name: txn_id
  type: bigint
  concept: Txn ID
  required: true
  is_key: true
  classification: internal
  description: Unique identifier for a payment card transaction.
- name: txn_date
  type: date
  concept: Txn Date
  required: true
  is_key: false
  classification: internal
  description: Date on which a payment card transaction was processed.
- name: merchant
  type: varchar
  concept: Merchant
  required: false
  is_key: false
  classification: internal
  description: Name or identifier of the merchant at which a card transaction was made.
- name: amount
  type: numeric
  concept: Amount
  required: true
  is_key: false
  classification: internal
  description: Monetary value associated with a transaction, payment, or financial event, denominated in the account's base
    currency.
- name: txn_type
  type: varchar
  concept: Txn Type
  required: true
  is_key: false
  classification: internal
  description: Type of card transaction, such as purchase, cash advance, or balance transfer.
- name: service_id
  type: bigint
  concept: Service ID
  required: true
  is_key: true
  classification: internal
  description: Unique identifier for a banking service or product feature.
- name: activity_type
  type: varchar
  concept: Activity Type
  required: true
  is_key: false
  classification: internal
  description: Classification of the activity, such as login, transaction, complaint, or inquiry.
- name: activity_date
  type: date
  concept: Activity Date
  required: true
  is_key: false
  classification: internal
  description: Calendar date on which a customer activity, transaction, or system event occurred.
- name: activity_desc
  type: varchar
  concept: Activity Desc
  required: false
  is_key: false
  classification: internal
  description: Free-text or coded description of the customer activity or interaction event.
- name: resolution_date
  type: date
  concept: Resolution Date
  required: true
  is_key: false
  classification: internal
  description: Date on which a complaint, dispute, or exception was resolved.
- name: charge_id
  type: bigint
  concept: Charge ID
  required: true
  is_key: true
  classification: internal
  description: Unique identifier for a fee or charge applied to an account.
- name: charge_type
  type: varchar
  concept: Charge Type
  required: true
  is_key: false
  classification: internal
  description: Classification of the charge by type, such as annual fee, late payment fee, or service charge.
- name: date
  type: date
  concept: Date
  required: true
  is_key: false
  classification: internal
  description: Calendar date associated with a record, event, or observation.
