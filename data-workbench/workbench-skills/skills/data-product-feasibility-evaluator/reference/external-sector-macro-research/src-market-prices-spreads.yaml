spec_id: src_market_prices_spreads
name: Market Prices & Spreads
domain: External Sector & Macro Research
product_kind: source
description: Normalized feed of market quotes and reference curves used for FX/interest-rate
  pass-through, BoP valuation effects, reserves analytics, and policy monitoring.
  Includes spot/forward FX, rates (OIS/IRS/bonds/bills), equities/commodities where
  relevant, and CDS spreads.
schema_version: '1.0'
classification: internal
grain:
  keys:
  - index_id
  description: ''
freshness:
  history: current
  cadence: ''
  description: ''
allowed_derivations:
- rename
- cast
attributes:
- name: isin_ticker
  type: varchar
  concept: Isin Ticker
  description: International Securities Identification Number or exchange ticker symbol uniquely identifying the financial instrument.
  required: false
  is_key: false
  classification: internal
- name: cfi
  type: varchar
  concept: Cfi
  description: ISO 10962 Classification of Financial Instruments code describing the instrument's asset class and key characteristics.
  required: false
  is_key: false
  classification: internal
- name: currency
  type: varchar
  concept: Currency
  description: ISO currency code of the instrument's pricing or quotation currency.
  required: true
  is_key: false
  classification: internal
- name: venue
  type: varchar
  concept: Venue
  description: Name or identifier of the trading venue, exchange, or market where the quote was sourced.
  required: false
  is_key: false
  classification: internal
- name: bid
  type: varchar
  concept: Bid
  description: Best buyer price quoted for the instrument at the time of capture.
  required: false
  is_key: false
  classification: internal
- name: ask
  type: varchar
  concept: Ask
  description: Best seller price or offer quoted for the instrument at the time of capture.
  required: false
  is_key: false
  classification: internal
- name: mid
  type: varchar
  concept: Mid
  description: Arithmetic midpoint between the bid and ask prices, used as a reference rate in valuation and analytics.
  required: false
  is_key: false
  classification: internal
- name: last
  type: varchar
  concept: Last
  description: Most recent executed trade price or last quoted price for the instrument.
  required: false
  is_key: false
  classification: internal
- name: open_high_low_close
  type: varchar
  concept: Open High Low Close
  description: Composite field capturing the opening, intraday high, intraday low, and closing prices for a given trading session.
  required: false
  is_key: false
  classification: internal
- name: yield
  type: varchar
  concept: Yield
  description: Annualized yield of a fixed-income instrument derived from its price, coupon, and maturity characteristics.
  required: false
  is_key: false
  classification: internal
- name: tenor
  type: varchar
  concept: Tenor
  description: Maturity bucket or time horizon of the instrument or rate quote on the yield curve (e.g. 3M, 1Y, 5Y).
  required: false
  is_key: false
  classification: internal
- name: day_count
  type: numeric
  concept: Day Count
  description: Numeric day-count convention used to accrue interest or calculate periods for the instrument (e.g. 30/360, Actual/365).
  required: false
  is_key: false
  classification: internal
- name: compounding
  type: varchar
  concept: Compounding
  description: Compounding frequency convention applied to the rate or yield (e.g. annual, semi-annual, continuous).
  required: false
  is_key: false
  classification: internal
- name: fixing_date
  type: date
  concept: Fixing Date
  description: Date on which a reference rate, FX rate, or floating rate is officially fixed for settlement purposes.
  required: true
  is_key: false
  classification: internal
- name: spot
  type: varchar
  concept: Spot
  description: Spot FX rate or spot price for the instrument, representing the current exchange or immediate settlement rate.
  required: false
  is_key: false
  classification: internal
- name: forward_points
  type: numeric
  concept: Forward Points
  description: Number of forward basis points added to or subtracted from the spot rate to derive the outright forward FX rate.
  required: false
  is_key: false
  classification: internal
- name: implied_rate
  type: numeric
  concept: Implied Rate
  description: Interest rate implied by the forward points and spot rate via covered interest parity, used for cross-currency analytics and reserves valuation.
  required: true
  is_key: false
  classification: internal
- name: cross
  type: varchar
  concept: Cross
  description: Currency pair label denoting the two currencies in an FX quote (e.g. USD/INR, EUR/USD).
  required: false
  is_key: false
  classification: internal
- name: type
  type: varchar
  concept: Type
  description: Classification of the price quote or instrument type, such as FX spot, FX forward, OIS rate, bond yield, or CDS spread.
  required: true
  is_key: false
  classification: internal
- name: maturity
  type: varchar
  concept: Maturity
  description: Expiry or maturity date of a derivative, bond, or forward contract.
  required: false
  is_key: false
  classification: internal
- name: strike
  type: varchar
  concept: Strike
  description: Agreed exercise price of an options contract at which the underlying instrument can be bought or sold.
  required: false
  is_key: false
  classification: internal
- name: vol
  type: varchar
  concept: Vol
  description: Implied or realized volatility of the instrument, expressed as an annualized percentage.
  required: false
  is_key: false
  classification: internal
- name: index_id
  type: bigint
  concept: Index ID
  description: Unique identifier for a financial index, benchmark, or reference rate series such as an equity index or rate fixing.
  required: true
  is_key: true
  classification: internal
- name: constituents
  type: varchar
  concept: Constituents
  description: List or reference to the component instruments that make up the index or basket.
  required: false
  is_key: false
  classification: internal
- name: weights
  type: varchar
  concept: Weights
  description: Weighting scheme applied to index constituents when computing the index level (e.g. market-cap weighted, equal-weighted).
  required: false
  is_key: false
  classification: internal
- name: source_vendor
  type: varchar
  concept: Source Vendor
  description: Name of the external market data vendor or provider that supplied this price or rate record.
  required: false
  is_key: false
  classification: internal
- name: timestamp_tz
  type: timestamp
  concept: Timestamp Tz
  description: Timezone-aware timestamp at which the price, rate, or quote was captured or published by the vendor.
  required: false
  is_key: false
  classification: internal
- name: latency_ms
  type: varchar
  concept: Latency Ms
  description: Round-trip latency in milliseconds between price generation and ingestion, used for data-quality monitoring.
  required: false
  is_key: false
  classification: internal
- name: completeness_flag
  type: boolean
  concept: Completeness Flag
  description: Boolean indicator that all expected price fields for this instrument and fixing date are present and valid.
  required: false
  is_key: false
  classification: internal
