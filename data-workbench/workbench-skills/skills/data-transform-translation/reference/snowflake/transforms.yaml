platform: snowflake
engine: "Snowflake (current)"

functions:
  AGE:
    capability: unsupported
    remediation: "Snowflake has no AGE. Decompose to a date_difference op (completed_units via FLOOR(MONTHS_BETWEEN(...)/12); boundary_count via DATEDIFF('year', start, end)). A symbolic interval is not natively expressible."
    citation: "https://docs.snowflake.com/en/sql-reference/functions-date-time"
    status: verified
  SPLIT_PART:
    capability: native
    emit: "SPLIT_PART({s}, {delim}, {idx})"
    notes: "1-based index; index 0 is treated as 1."
    citation: "https://docs.snowflake.com/en/sql-reference/functions/split_part"
    status: verified
  TO_CHAR:
    capability: native
    emit: "TO_CHAR({value}, {format})"
    notes: "Snowflake TO_CHAR/TO_VARCHAR format model; tokens differ from Postgres in edge cases."
    citation: "https://docs.snowflake.com/en/sql-reference/functions/to_char"
    status: verified
  DATEDIFF:
    capability: native
    emit: "DATEDIFF({part}, {start}, {end})"
    notes: "First arg is the date part; DATEDIFF('year', start, end) counts boundary crossings, NOT completed years."
    citation: "https://docs.snowflake.com/en/sql-reference/functions/datediff"
    status: verified
  MONTHS_BETWEEN:
    capability: native
    emit: "MONTHS_BETWEEN({end}, {start})"
    citation: "https://docs.snowflake.com/en/sql-reference/functions/months_between"
    status: verified
  TIMESTAMPDIFF:
    capability: native
    emit: "TIMESTAMPDIFF({part}, {start}, {end})"
    notes: "Alias of DATEDIFF in Snowflake."
    citation: "https://docs.snowflake.com/en/sql-reference/functions/timestampdiff"
    status: verified
  DATE_TRUNC:
    capability: native
    emit: "DATE_TRUNC({unit}, {ts})"
    citation: "https://docs.snowflake.com/en/sql-reference/functions/date_trunc"
    status: verified
  MD5:
    capability: native
    emit: "MD5({text})"
    notes: "Returns a 32-char hex string."
    citation: "https://docs.snowflake.com/en/sql-reference/functions/md5"
    status: verified
  SHA1:
    capability: native
    emit: "SHA1({text})"
    citation: "https://docs.snowflake.com/en/sql-reference/functions/sha1"
    status: verified
  SHA2:
    capability: native
    emit: "SHA2({text}, 256)"
    citation: "https://docs.snowflake.com/en/sql-reference/functions/sha2"
    status: verified
  REGEXP_REPLACE:
    capability: native
    emit: "REGEXP_REPLACE({s}, {pattern}, {repl})"
    notes: "Replaces all occurrences when neither position nor occurrence is given."
    citation: "https://docs.snowflake.com/en/sql-reference/functions/regexp_replace"
    status: verified
  DATE_FORMAT:
    capability: unsupported
    remediation: "No DATE_FORMAT. Use TO_CHAR({ts}, {format})."
    citation: "https://docs.snowflake.com/en/sql-reference/functions/to_char"
    status: verified
  DATE_DIFF:
    capability: unsupported
    remediation: "Snowflake spells it DATEDIFF({part}, start, end), not DATE_DIFF. Use DATEDIFF or a date_difference op."
    citation: "https://docs.snowflake.com/en/sql-reference/functions/datediff"
    status: verified
  DIGEST:
    capability: unsupported
    remediation: "No pgcrypto DIGEST. Use SHA2({text}, 256) / SHA1() / MD5()."
    citation: "https://docs.snowflake.com/en/sql-reference/functions/sha2"
    status: verified
  # ── Common Snowflake authoring functions ──────────────────────────────────
  # Keys are the sqlglot CANONICAL AST names the validator sees (see
  # _func_name() in dialect_sql.py) when the authored expression is parsed with
  # read='snowflake'. Author-facing spellings differ where noted; sqlglot
  # canonicalises them and re-renders to the native Snowflake spelling.
  DATE_ADD:
    capability: native
    emit: "DATEADD({unit}, {amount}, {date})"
    notes: "Author-facing DATEADD / TIMESTAMPADD; sqlglot canonicalises DATEADD→DATE_ADD under the snowflake dialect and renders back to DATEADD(part, value, date)."
    citation: "https://docs.snowflake.com/en/sql-reference/functions/dateadd"
    status: conformance-verify
  DECODE_CASE:
    capability: native
    emit: "DECODE({expr}, {search1}, {result1}, ..., {default})"
    notes: "Author-facing DECODE; sqlglot models it as a CASE-equivalent (DECODE_CASE). Snowflake DECODE uses NULL-safe equality (unlike a plain CASE =)."
    citation: "https://docs.snowflake.com/en/sql-reference/functions/decode"
    status: conformance-verify
  NVL2:
    capability: native
    emit: "NVL2({expr}, {if_not_null}, {if_null})"
    citation: "https://docs.snowflake.com/en/sql-reference/functions/nvl2"
    status: conformance-verify
  CONVERT_TIMEZONE:
    capability: native
    emit: "CONVERT_TIMEZONE({from_tz}, {to_tz}, {ts}) | CONVERT_TIMEZONE({to_tz}, {tz_aware_ts})"
    notes: "3-arg form converts a naive ts from source→target tz; 2-arg form converts a TZ-aware ts to target tz."
    citation: "https://docs.snowflake.com/en/sql-reference/functions/convert_timezone"
    status: conformance-verify
  TRY_CAST:
    capability: native
    emit: "TRY_CAST({expr} AS {type})"
    notes: "Returns NULL instead of raising on an invalid cast."
    citation: "https://docs.snowflake.com/en/sql-reference/functions/try_cast"
    status: conformance-verify
  TO_NUMBER:
    capability: native
    emit: "TO_NUMBER({expr}) | TRY_TO_NUMBER({expr})"
    notes: "Author-facing TO_NUMBER / TRY_TO_NUMBER both canonicalise to TO_NUMBER under the snowflake dialect; both are native (TRY_ variant returns NULL on failure)."
    citation: "https://docs.snowflake.com/en/sql-reference/functions/to_decimal"
    status: conformance-verify
  TS_OR_DS_TO_DATE:
    capability: native
    emit: "TO_DATE({expr} [, {format}])"
    notes: "Author-facing TO_DATE / TRY_TO_DATE canonicalise to sqlglot's TS_OR_DS_TO_DATE under the snowflake dialect; renders back to TO_DATE. Native."
    citation: "https://docs.snowflake.com/en/sql-reference/functions/to_date"
    status: conformance-verify
  TO_TIMESTAMP:
    capability: native
    emit: "TO_TIMESTAMP({expr} [, {format}])"
    notes: "Also TO_TIMESTAMP_LTZ/_TZ variants; the bare form respects the session TIMESTAMP mapping."
    citation: "https://docs.snowflake.com/en/sql-reference/functions/to_timestamp"
    status: conformance-verify
  TO_TIMESTAMP_NTZ:
    capability: native
    emit: "TO_TIMESTAMP_NTZ({expr} [, {format}])"
    notes: "Wall-clock (no timezone) timestamp."
    citation: "https://docs.snowflake.com/en/sql-reference/functions/to_timestamp"
    status: conformance-verify
  PARSE_JSON:
    capability: native
    emit: "PARSE_JSON({string})"
    notes: "Returns a VARIANT; pair with :path / [idx] accessors and TRY_PARSE_JSON for lenient parsing."
    citation: "https://docs.snowflake.com/en/sql-reference/functions/parse_json"
    status: conformance-verify
  GROUP_CONCAT:
    capability: native
    emit: "LISTAGG({expr}, {sep}) WITHIN GROUP (ORDER BY {sort})"
    notes: "Author-facing LISTAGG; sqlglot canonicalises LISTAGG→GROUP_CONCAT under the snowflake dialect and renders back to LISTAGG. Use WITHIN GROUP (ORDER BY …) for deterministic ordering."
    citation: "https://docs.snowflake.com/en/sql-reference/functions/listagg"
    status: conformance-verify

ops:
  date_difference:
    completed_units:
      capability: emulated
      emit: "FLOOR(MONTHS_BETWEEN({end}, {start}) / 12)"
      notes: "Completed whole years."
      status: conformance-verify
      citation: "https://docs.snowflake.com/en/sql-reference/functions/months_between"
    boundary_count:
      capability: native
      emit: "DATEDIFF('year', {start}, {end})"
      notes: "Counts calendar-year boundaries, NOT completed elapsed years."
      status: conformance-verify
      citation: "https://docs.snowflake.com/en/sql-reference/functions/datediff"
    symbolic_interval:
      capability: unsupported
      remediation: "No native symbolic (yrs+mos+days) interval. Emit separate completed_units per unit, or an OBJECT of counts."
      citation: "https://docs.snowflake.com/en/sql-reference/functions-date-time"
      status: verified
  split_part:
    default:
      capability: native
      emit: "SPLIT_PART({s}, {delim}, {idx})"
      notes: "1-based index."
      status: verified
      citation: "https://docs.snowflake.com/en/sql-reference/functions/split_part"
