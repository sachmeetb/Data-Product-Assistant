  <text x="1150" y="588" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#334155" text-anchor="start">Published products searchable</text>
  <text x="1150" y="603" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#334155" text-anchor="start">and consumable by AI agents</text>
