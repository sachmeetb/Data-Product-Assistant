  <text x="602" y="588" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#334155" text-anchor="start">Every product carries a machine-</text>
  <text x="602" y="603" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#334155" text-anchor="start">readable contract: schema, rules,</text>
  <text x="602" y="618" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#334155" text-anchor="start">lineage, and governance built in.</text>
