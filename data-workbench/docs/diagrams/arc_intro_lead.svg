  <text x="876" y="588" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#334155" text-anchor="start">Source-aligned: certify existing</text>
  <text x="876" y="603" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#334155" text-anchor="start">databases. Consumer-aligned:</text>
  <text x="876" y="618" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#334155" text-anchor="start">design for your AI use cases.</text>
