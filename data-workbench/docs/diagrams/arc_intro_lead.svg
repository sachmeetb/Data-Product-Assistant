  <text x="46" y="66" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="normal" fill="#94A3B8" text-anchor="start">An AI-powered platform for building, governing, and publishing enterprise data products</text>
  <text x="1394" y="36" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#0EA5E9" text-anchor="end">AI-Powered  ·  Human-Governed  ·  AI-Ready</text>
  <text x="1394" y="60" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748B" text-anchor="end">Engineering Workbench  +  Product Workbench</text>
