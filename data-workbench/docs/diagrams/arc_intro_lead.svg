  <text x="60" y="190" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="normal" fill="#CBD5E1" text-anchor="start">Agent skills automate the heavy lifting —</text>
  <text x="60" y="207" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="normal" fill="#CBD5E1" text-anchor="start">engineers and product owners review and</text>
  <text x="60" y="224" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="normal" fill="#CBD5E1" text-anchor="start">approve at every step.</text>
