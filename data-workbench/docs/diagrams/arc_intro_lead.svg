  <text x="68" y="392" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#94A3B8" text-anchor="start">Design products contract-first,</text>
  <text x="68" y="407" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#94A3B8" text-anchor="start">validate and publish to marketplace</text>
