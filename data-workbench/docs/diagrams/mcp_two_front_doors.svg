  <rect x="465" y="666" width="8" height="58" rx="4" fill="#16A34A"/>
  <text x="493" y="688" font-size="15" font-weight="900" fill="#14532D" text-anchor="start" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">one Workbench skill</text>
  <text x="957" y="688" font-size="8.6" font-weight="700" fill="#64748B" text-anchor="end" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" dominant-baseline="middle">Skill tool</text>
  <text x="493" y="711" font-size="10.5" font-weight="600" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">same server-side skill whether invoked by UI or MCP</text>
