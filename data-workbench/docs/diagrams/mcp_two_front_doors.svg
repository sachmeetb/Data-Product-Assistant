<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" width="1440" height="810" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
  <title>Two Front Doors, One Skill Set</title>
  <desc>The web UI and MCP run_stage entry point converge on start_stage_run, build_prompt, the agent harness, and one Workbench skill.</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.52" stop-color="#F4F7FB"/>
      <stop offset="1" stop-color="#EEF4F7"/>
    </linearGradient>
    <linearGradient id="header-bg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.45" stop-color="#172033"/>
      <stop offset="1" stop-color="#14213D"/>
    </linearGradient>
    <linearGradient id="endpoint-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#132238"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="agent-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#FFF7ED"/>
      <stop offset="1" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="skill-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ECFDF5"/>
      <stop offset="1" stop-color="#F0FDFA"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.28"/>
    </pattern>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
    <filter id="tight-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <filter id="endpoint-glow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#38BDF8" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4F46E5"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/></marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E11D48"/></marker>
  </defs>
  <rect x="0" y="0" width="1440" height="810" rx="0" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1440" height="92" rx="0" fill="#0F172A"/>
  <text x="720.0" y="30" font-size="25" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">Two Front Doors, One Skill Set</text>
  <text x="720.0" y="62" font-size="13" font-weight="500" fill="#CBD5E1" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">The browser and MCP enter differently, then converge on the exact same backend execution spine.</text>
  <rect x="616.0" y="87" width="208" height="4" rx="2" fill="#F59E0B"/>
  <rect x="64" y="126" width="370" height="180" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.6" filter="url(#shadow)"/>
  <rect x="64" y="126" width="370" height="34" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="64" y="148" width="370" height="12" rx="0" fill="#DBEAFE"/>
  <circle cx="82" cy="143" r="4.5" fill="#EF4444"/>
  <circle cx="98" cy="143" r="4.5" fill="#F59E0B"/>
  <circle cx="114" cy="143" r="4.5" fill="#22C55E"/>
  <text x="249" y="143" font-size="12.5" font-weight="850" fill="#1E3A8A" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">Workbench Web UI</text>
  <text x="88" y="184" font-size="15" font-weight="850" fill="#0F172A" text-anchor="start" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">user-friendly path</text>
  <text x="88" y="206" font-size="10.5" font-weight="600" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">A human clicks Run Stage and watches streamed progress.</text>
  <rect x="88" y="230" width="90" height="34" rx="7" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.2"/>
  <text x="133" y="247" font-size="8.8" font-weight="800" fill="#2563EB" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">Data Discovery</text>
  <rect x="193" y="230" width="90" height="34" rx="7" fill="#F8FAFC" stroke="#16A34A" stroke-width="1.2"/>
  <text x="238" y="247" font-size="8.8" font-weight="800" fill="#16A34A" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">Mapping</text>
  <rect x="298" y="230" width="90" height="34" rx="7" fill="#F8FAFC" stroke="#E11D48" stroke-width="1.2"/>
  <text x="343" y="247" font-size="8.8" font-weight="800" fill="#E11D48" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">Review</text>
