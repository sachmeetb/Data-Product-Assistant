  <rect x="438" y="526" width="10" height="112" rx="5" fill="#D97706"/>
  <text x="720" y="552" font-size="18" font-weight="950" fill="#92400E" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">AGENT HARNESS</text>
  <text x="720" y="576" font-size="11.5" font-weight="800" fill="#B45309" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">claude_code_sdk sub-agent running server-side</text>
  <text x="720" y="600" font-size="10.5" font-weight="700" fill="#78350F" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" dominant-baseline="middle">Allowed tools: Read, Write, Edit, Bash, Glob, Grep, Skill</text>
  <text x="720" y="620" font-size="10" font-weight="650" fill="#78350F" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">anti-exploration prompt, project cwd, max_turns=100</text>
  <text x="984" y="548" font-size="8.6" font-weight="700" fill="#B45309" text-anchor="end" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" dominant-baseline="middle">sdk_runner.py</text>
