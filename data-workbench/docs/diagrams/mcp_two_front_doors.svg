  <text x="183.0" y="286.0" font-size="9.2" font-weight="700" fill="#1D4ED8" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">event sink: WebSocket send</text>
  <rect x="1006" y="126" width="370" height="180" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.6" filter="url(#shadow)"/>
  <rect x="1006" y="126" width="370" height="34" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1"/>
  <rect x="1006" y="148" width="370" height="12" rx="0" fill="#EDE9FE"/>
  <text x="1191" y="143" font-size="12.5" font-weight="850" fill="#4C1D95" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">MCP Client</text>
  <text x="1030" y="184" font-size="15" font-weight="850" fill="#0F172A" text-anchor="start" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">programmatic path</text>
  <text x="1030" y="206" font-size="10.5" font-weight="600" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">Claude Code, an IDE, or Codex calls the same capability.</text>
  <rect x="1030" y="227" width="322" height="42" rx="7" fill="#111827" stroke="#312E81" stroke-width="1"/>
  <text x="1048" y="242" font-size="11" font-weight="750" fill="#E0E7FF" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" dominant-baseline="middle">mcp__workbench__run_stage(...)</text>
  <text x="1048" y="260" font-size="9.5" font-weight="650" fill="#A5B4FC" text-anchor="start" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" dominant-baseline="middle">then poll get_project_state</text>
  <rect x="1030" y="274" width="154" height="23" rx="11.5" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1"/>
  <text x="1107.0" y="286.0" font-size="9.2" font-weight="700" fill="#5B21B6" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">event sink: no-op</text>
  <rect x="1196" y="274" width="156" height="23" rx="11.5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1274.0" y="286.0" font-size="9.2" font-weight="700" fill="#475569" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">status via read tools</text>
  <rect x="600" y="176" width="240" height="28" rx="14.0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="720.0" y="190.5" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">same Workbench capability</text>
  <path d="M 434 218 C 520 218 536 330 594 330" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path d="M 1006 218 C 920 218 904 330 846 330" fill="none" stroke="#4F46E5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/>
  <text x="528" y="248" font-size="10" font-weight="800" fill="#2563EB" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">WebSocket run_stage</text>
  <text x="912" y="248" font-size="10" font-weight="800" fill="#4F46E5" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">MCP run_stage tool</text>
  <rect x="465" y="324" width="510" height="68" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" filter="url(#tight-shadow)"/>
  <rect x="465" y="324" width="8" height="68" rx="4" fill="#2563EB"/>
  <text x="493" y="346" font-size="15" font-weight="900" fill="#1E3A8A" text-anchor="start" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">start_stage_run(event_sink)</text>
  <text x="957" y="346" font-size="8.6" font-weight="700" fill="#64748B" text-anchor="end" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" dominant-baseline="middle">stage_execution.py</text>
  <text x="493" y="369" font-size="10.5" font-weight="600" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">resolves the stage, marks it running, returns a run_id</text>
  <text x="493" y="385" font-size="10.5" font-weight="600" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">the event sink is the only caller-specific parameter</text>
  <line x1="720" y1="392" x2="720" y2="420" stroke="#64748B" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
  <rect x="465" y="420" width="510" height="78" rx="10" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.8" filter="url(#tight-shadow)"/>
  <rect x="465" y="420" width="8" height="78" rx="4" fill="#7C3AED"/>
  <text x="493" y="442" font-size="15" font-weight="900" fill="#4C1D95" text-anchor="start" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">build_prompt(stage_def, project)</text>
  <text x="957" y="442" font-size="8.6" font-weight="700" fill="#64748B" text-anchor="end" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" dominant-baseline="middle">pipeline.py</text>
  <text x="493" y="465" font-size="10.5" font-weight="600" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">prepends the directive to load the stage&#x27;s skill first</text>
  <text x="493" y="481" font-size="10.5" font-weight="600" fill="#475569" text-anchor="start" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">injects project config, table picks, and lifecycle context</text>
  <line x1="720" y1="498" x2="720" y2="526" stroke="#64748B" stroke-width="2.7" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
