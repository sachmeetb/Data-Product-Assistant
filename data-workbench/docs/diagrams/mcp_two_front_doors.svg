  <text x="232" y="778" font-size="9.2" font-weight="600" fill="#64748B" text-anchor="start" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" dominant-baseline="middle">catalog, DQV, lineage, PROV-O</text>
