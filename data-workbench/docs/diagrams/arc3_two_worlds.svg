  <line x1="490" y1="720" x2="490" y2="790" stroke="#334155" stroke-width="1"/>
  <text x="514" y="730" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#F1F5F9" text-anchor="start">Engineer implements.</text>
  <text x="514" y="754" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="normal" fill="#94A3B8" text-anchor="start">Agent skills do the heavy</text>
