  <text x="974" y="730" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#F1F5F9" text-anchor="start">Both sides stay aligned.</text>
  <text x="974" y="754" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="normal" fill="#94A3B8" text-anchor="start">Contract is the shared artifact.</text>
  <text x="974" y="768" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="normal" fill="#94A3B8" text-anchor="start">AI is the accelerator.</text>
