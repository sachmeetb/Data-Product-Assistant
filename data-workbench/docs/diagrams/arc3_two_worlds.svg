  <rect width="1440" height="810" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1440" height="78" rx="0" ry="0" fill="#0F172A" stroke="none" stroke-width="1.5"/>
  <text x="48" y="30" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">The gap between what business wants and what data delivers is the most expensive gap in any enterprise.</text>
  <text x="48" y="57" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="normal" fill="#94A3B8" text-anchor="start">Data Workbench gives each persona the right tool, connected by a contract both sides can trust.</text>
