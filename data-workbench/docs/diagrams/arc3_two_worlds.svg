  <text x="964" y="371" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#1E3A8A" text-anchor="start">4  Generate virtual serving views</text>
  <text x="964" y="389" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#2563EB" text-anchor="start">SQL DDL auto-generated · FK-aware JOIN logic</text>
