  <text x="700" y="643" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="8" font-weight="normal" fill="#D97706" text-anchor="middle">Neo4j Knowledge Graph · PROV-O Provenance</text>
