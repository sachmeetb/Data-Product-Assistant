  <text x="1146" y="112" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#1E3A8A" text-anchor="start">AI-Powered Applications</text>
  <text x="1146" y="130" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#2563EB" text-anchor="start">Apps with semantic context.</text>
