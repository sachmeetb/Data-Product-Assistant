  <text x="306" y="254" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#92400E" text-anchor="start">Business Ontology  (Top Layer)</text>
  <text x="306" y="272" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#D97706" text-anchor="start">Maps business concepts and terms.</text>
  <text x="306" y="286" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#D97706" text-anchor="start">Ensures consistent KPIs,</text>
  <text x="306" y="300" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#D97706" text-anchor="start">metrics, and definitions.</text>
