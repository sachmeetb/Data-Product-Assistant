  <text x="679" y="254" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#92400E" text-anchor="start">Data Product Metadata  (Bottom Layer)</text>
  <text x="679" y="272" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#D97706" text-anchor="start">Maps ontology concepts</text>
  <text x="679" y="286" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#D97706" text-anchor="start">to certified data products.</text>
  <text x="679" y="300" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#D97706" text-anchor="start">Bridges business to technical.</text>
  <rect x="1040" y="236" width="359" height="110" rx="6" ry="6" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="1052" y="254" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#92400E" text-anchor="start">Semantic Routing + Context</text>
  <text x="1052" y="272" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#D97706" text-anchor="start">Routes AI queries to the right</text>
  <text x="1052" y="286" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#D97706" text-anchor="start">data product automatically.</text>
  <text x="1052" y="300" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#D97706" text-anchor="start">Injects semantic context into prompts.</text>
