  <rect width="1440" height="810" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1440" height="74" rx="0" ry="0" fill="#0F172A" stroke="none" stroke-width="1.5"/>
  <text x="48" y="26" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">The three layers every AI initiative needs. Start with the foundation.</text>
  <text x="48" y="54" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="normal" fill="#94A3B8" text-anchor="start">AI agents are only as good as the data they reason over.  Reliable AI begins with reliable, governed data products.</text>
