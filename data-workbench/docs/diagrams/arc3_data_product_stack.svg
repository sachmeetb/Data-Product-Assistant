  <text x="310" y="362" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#92400E" text-anchor="start">Proof-of-concept dual-ontology semantic layer included in Data Workbench — demonstrates how governed data products directly power AI queries</text>
