  <rect x="40" y="118" width="46" height="18" rx="9" ry="9" fill="#2563EB" stroke="none" stroke-width="1.5"/>
  <text x="63" y="127" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">Layer 3</text>
  <text x="40" y="146" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E3A8A" text-anchor="start">AI AGENTS &amp;</text>
  <text x="40" y="162" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E3A8A" text-anchor="start">APPLICATIONS</text>
  <text x="40" y="184" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#475569" text-anchor="start">The Consumer</text>
  <line x1="282" y1="92" x2="282" y2="196" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="294" y="94" width="266" height="100" rx="6" ry="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="306" y="112" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#1E3A8A" text-anchor="start">Natural Language Queries</text>
  <text x="306" y="130" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#2563EB" text-anchor="start">Ask in business terms.</text>
  <text x="306" y="144" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#2563EB" text-anchor="start">Get trusted, governed answers.</text>
  <rect x="574" y="94" width="266" height="100" rx="6" ry="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="586" y="112" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#1E3A8A" text-anchor="start">Agentic Workflows</text>
  <text x="586" y="130" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#2563EB" text-anchor="start">Multi-step AI processes grounded</text>
  <text x="586" y="144" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#2563EB" text-anchor="start">in certified data products.</text>
  <rect x="854" y="94" width="266" height="100" rx="6" ry="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="866" y="112" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" fill="#1E3A8A" text-anchor="start">Automated Analytics</text>
  <text x="866" y="130" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#2563EB" text-anchor="start">Agents reason over data directly.</text>
  <text x="866" y="144" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="normal" fill="#2563EB" text-anchor="start">No manual query engineering.</text>
