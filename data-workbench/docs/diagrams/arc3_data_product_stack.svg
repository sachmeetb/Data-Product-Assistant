  <text x="308" y="462" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" dominant-baseline="middle">SOURCE-ALIGNED  —  certify what you have</text>
  <text x="314" y="494" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="normal" fill="#14532D" text-anchor="start">→  Discovered from existing databases and data warehouses</text>
  <text x="314" y="518" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="normal" fill="#14532D" text-anchor="start">→  Auto-profiled and AI-enriched with business descriptions</text>
  <text x="314" y="542" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="normal" fill="#14532D" text-anchor="start">→  ODCS data contract synthesized from approved graph state</text>
  <text x="314" y="566" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="normal" fill="#14532D" text-anchor="start">→  Quality rules generated from observed data patterns</text>
  <text x="314" y="590" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="normal" fill="#14532D" text-anchor="start">→  Published to marketplace with full schema lineage</text>
  <rect x="853" y="448" width="547" height="152" rx="8" ry="8" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5"/>
  <rect x="853" y="448" width="547" height="28" rx="8" ry="8" fill="#16A34A"/>
  <text x="867" y="462" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" dominant-baseline="middle">CONSUMER-ALIGNED  —  build what you need</text>
  <text x="873" y="494" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="normal" fill="#14532D" text-anchor="start">→  Contract-first: schema designed before engineering begins</text>
  <text x="873" y="518" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="normal" fill="#14532D" text-anchor="start">→  Product Owner shapes columns, rules, and grain in a wizard</text>
  <text x="873" y="542" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="normal" fill="#14532D" text-anchor="start">→  Bound to source-aligned products via governed CONSUMES edges</text>
  <text x="873" y="566" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="normal" fill="#14532D" text-anchor="start">→  Virtual serving views generated with FK-aware join logic</text>
  <text x="873" y="590" font-family="'Segoe UI', Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="normal" fill="#14532D" text-anchor="start">→  AI-ready: certified, governed, and semantically grounded</text>
