<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Data Agents — Reference Deployment Topology (C4-Container view)</title>
  <desc>Production-shaped deployment with web app, API gateway, agent worker pool, knowledge graph, state DB, source databases, object storage, secret manager, identity provider, and observability stack.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arr-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
    <linearGradient id="user" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="dropshadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="640" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#111">Data Agents — Reference Deployment Topology</text>
  <text x="640" y="58" font-size="12" text-anchor="middle" fill="#555">C4 Container view. Boxes = deployable units; arrows labelled with protocol. Orange = LLM-aware; green = stateful stores; grey = platform services.</text>

  <!-- Personas (top) -->
  <g filter="url(#dropshadow)">
    <ellipse cx="200" cy="118" rx="80" ry="32" fill="#fff" stroke="#1f4ea3" stroke-width="1.6"/>
    <text x="200" y="115" font-size="13" text-anchor="middle" font-weight="700" fill="#1f4ea3">Product Owner</text>
    <text x="200" y="132" font-size="10" text-anchor="middle" fill="#444">authoring · review</text>

    <ellipse cx="450" cy="118" rx="80" ry="32" fill="#fff" stroke="#1f4ea3" stroke-width="1.6"/>
    <text x="450" y="115" font-size="13" text-anchor="middle" font-weight="700" fill="#1f4ea3">Data Engineer</text>
    <text x="450" y="132" font-size="10" text-anchor="middle" fill="#444">pipeline · chat</text>

    <ellipse cx="700" cy="118" rx="100" ry="32" fill="#fff" stroke="#1f4ea3" stroke-width="1.6"/>
    <text x="700" y="115" font-size="13" text-anchor="middle" font-weight="700" fill="#1f4ea3">Steward / DQ Analyst</text>
    <text x="700" y="132" font-size="10" text-anchor="middle" fill="#444">reviews · scoring</text>

    <ellipse cx="950" cy="118" rx="80" ry="32" fill="#fff" stroke="#1f4ea3" stroke-width="1.6"/>
    <text x="950" y="115" font-size="13" text-anchor="middle" font-weight="700" fill="#1f4ea3">Consumer</text>
    <text x="950" y="132" font-size="10" text-anchor="middle" fill="#444">marketplace</text>
  </g>

  <!-- HTTPS arrows from personas down to web app -->
  <g stroke="#444" stroke-width="1.4" fill="none" marker-end="url(#arr)">
    <line x1="200" y1="150" x2="350" y2="195"/>
    <line x1="450" y1="150" x2="450" y2="195"/>
    <line x1="700" y1="150" x2="550" y2="195"/>
    <line x1="950" y1="150" x2="650" y2="195"/>
  </g>
  <text x="450" y="178" font-size="10" text-anchor="middle" fill="#444">HTTPS · WebSocket</text>

  <!-- Web App -->
  <g filter="url(#dropshadow)">
    <rect x="300" y="195" width="380" height="80" rx="10" fill="#dbe7ff" stroke="#1f4ea3" stroke-width="1.5"/>
  </g>
  <text x="490" y="215" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2c5e">Web App (SPA)</text>
  <text x="490" y="232" font-size="11" text-anchor="middle" fill="#3a4a7a">React · TS · WebSocket client · CSS-in-JS</text>
  <text x="490" y="248" font-size="10" text-anchor="middle" fill="#555">Static-hosted; can live on CDN. Dual shells (Product / Engineering).</text>
  <text x="490" y="265" font-size="9" text-anchor="middle" fill="#777" font-style="italic">[alts: Streamlit · Next.js · Retool · IDE plugin]</text>

  <!-- API Gateway / App Server -->
  <g filter="url(#dropshadow)">
    <rect x="240" y="305" width="500" height="90" rx="10" fill="#f1ecff" stroke="#5b3eb6" stroke-width="1.5"/>
  </g>
  <text x="490" y="325" font-size="14" text-anchor="middle" font-weight="700" fill="#3b1d77">API gateway / App server</text>
  <text x="490" y="342" font-size="11" text-anchor="middle" fill="#553a8c">REST + WebSocket · workflow orchestration · review APIs · marketplace · HITL message queue</text>
  <text x="490" y="358" font-size="10" text-anchor="middle" fill="#555">Stateless; scaled horizontally behind a load balancer with WS-aware routing.</text>
  <text x="490" y="375" font-size="9" text-anchor="middle" fill="#777" font-style="italic">[alts: FastAPI · Express · Spring Boot · Go net/http · Rails ActionCable]</text>

  <!-- Web App ↔ API arrow -->
  <g stroke="#444" stroke-width="1.4" fill="none" marker-end="url(#arr)" marker-start="url(#arr)">
    <line x1="490" y1="275" x2="490" y2="305"/>
  </g>
  <text x="510" y="293" font-size="10" fill="#444">JSON · WS frames</text>

  <!-- Agent worker pool -->
  <g filter="url(#dropshadow)">
    <rect x="800" y="305" width="320" height="90" rx="10" fill="#ffe8d4" stroke="#c9711f" stroke-width="1.5"/>
  </g>
  <text x="960" y="325" font-size="14" text-anchor="middle" font-weight="700" fill="#7a3e09">Agent worker pool</text>
  <text x="960" y="342" font-size="11" text-anchor="middle" fill="#9c5a18">LLM SDK · tool runtime · skill loader · sandbox</text>
  <text x="960" y="358" font-size="10" text-anchor="middle" fill="#555">Spawned per stage; cwd = project dir. Bounded autonomy.</text>
  <text x="960" y="375" font-size="9" text-anchor="middle" fill="#777" font-style="italic">[alts: Claude Code SDK · LangGraph · AutoGen · MCP · custom]</text>

  <!-- API ↔ Agent pool arrow -->
  <g stroke="#444" stroke-width="1.4" fill="none" marker-end="url(#arr)" marker-start="url(#arr)">
    <line x1="740" y1="350" x2="800" y2="350"/>
  </g>
  <text x="770" y="345" font-size="10" text-anchor="middle" fill="#444">spawn / stream</text>

  <!-- LLM provider -->
  <g filter="url(#dropshadow)">
    <rect x="1140" y="305" width="120" height="90" rx="10" fill="#fff" stroke="#c9711f" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <text x="1200" y="335" font-size="13" text-anchor="middle" font-weight="700" fill="#7a3e09">LLM provider</text>
  <text x="1200" y="352" font-size="10" text-anchor="middle" fill="#555">Anthropic / OpenAI</text>
  <text x="1200" y="365" font-size="10" text-anchor="middle" fill="#555">/ Bedrock / Vertex</text>
  <text x="1200" y="382" font-size="9" text-anchor="middle" fill="#777" font-style="italic">streaming · tool-use</text>
  <g stroke="#444" stroke-width="1.4" fill="none" marker-end="url(#arr)" marker-start="url(#arr)">
    <line x1="1120" y1="350" x2="1140" y2="350"/>
  </g>

  <!-- State DB -->
  <g filter="url(#dropshadow)">
    <rect x="40" y="430" width="200" height="100" rx="10" fill="#cfeed8" stroke="#3a8c5a" stroke-width="1.5"/>
  </g>
  <text x="140" y="452" font-size="13" text-anchor="middle" font-weight="700" fill="#1f4a31">State DB</text>
  <text x="140" y="470" font-size="11" text-anchor="middle" fill="#2c6743">projects · workflows · stage runs · event log · chat sessions · DQ test runs</text>
  <text x="140" y="498" font-size="10" text-anchor="middle" fill="#555">Append-mostly · idempotent migrations</text>
  <text x="140" y="516" font-size="9" text-anchor="middle" fill="#777" font-style="italic">[alts: SQLite · Postgres · CockroachDB]</text>

  <!-- Knowledge Graph -->
  <g filter="url(#dropshadow)">
    <rect x="270" y="430" width="240" height="100" rx="10" fill="#cfeed8" stroke="#3a8c5a" stroke-width="1.5"/>
  </g>
  <text x="390" y="452" font-size="13" text-anchor="middle" font-weight="700" fill="#1f4a31">Knowledge graph DB</text>
  <text x="390" y="470" font-size="11" text-anchor="middle" fill="#2c6743">DCAT · DQV · SHACL · PROV-O · ODCS · DPROD</text>
  <text x="390" y="498" font-size="10" text-anchor="middle" fill="#555">Project-scoped URIs (multi-tenant)</text>
  <text x="390" y="516" font-size="9" text-anchor="middle" fill="#777" font-style="italic">[alts: Neo4j · Neptune · JanusGraph · Memgraph]</text>

  <!-- Object storage -->
  <g filter="url(#dropshadow)">
    <rect x="540" y="430" width="200" height="100" rx="10" fill="#cfeed8" stroke="#3a8c5a" stroke-width="1.5"/>
  </g>
  <text x="640" y="452" font-size="13" text-anchor="middle" font-weight="700" fill="#1f4a31">Object storage</text>
  <text x="640" y="470" font-size="11" text-anchor="middle" fill="#2c6743">project dirs · skills · artifacts · attachments</text>
  <text x="640" y="498" font-size="10" text-anchor="middle" fill="#555">Versioned via git or content-hash</text>
  <text x="640" y="516" font-size="9" text-anchor="middle" fill="#777" font-style="italic">[alts: S3 · GCS · MinIO · NFS]</text>

  <!-- Source DBs -->
  <g filter="url(#dropshadow)">
    <rect x="770" y="430" width="220" height="100" rx="10" fill="#cfeed8" stroke="#3a8c5a" stroke-width="1.5"/>
  </g>
  <text x="880" y="452" font-size="13" text-anchor="middle" font-weight="700" fill="#1f4a31">Source data systems</text>
  <text x="880" y="470" font-size="11" text-anchor="middle" fill="#2c6743">Postgres · MySQL · Snowflake · BigQuery · …</text>
  <text x="880" y="498" font-size="10" text-anchor="middle" fill="#555">Read-only credentials per project</text>
  <text x="880" y="516" font-size="9" text-anchor="middle" fill="#777" font-style="italic">connectors live in agent worker pool</text>

  <!-- Reflection / cron -->
  <g filter="url(#dropshadow)">
    <rect x="1020" y="430" width="240" height="100" rx="10" fill="#fff7e6" stroke="#c08a2a" stroke-width="1.5"/>
  </g>
  <text x="1140" y="452" font-size="13" text-anchor="middle" font-weight="700" fill="#7a4f0a">Reflection / cron jobs</text>
  <text x="1140" y="470" font-size="11" text-anchor="middle" fill="#9c6817">skill-reflector · chat-reflector · catalog rebuilds</text>
  <text x="1140" y="498" font-size="10" text-anchor="middle" fill="#555">Scheduled; emits Markdown PRs</text>
  <text x="1140" y="516" font-size="9" text-anchor="middle" fill="#777" font-style="italic">[alts: Airflow · Argo · k8s CronJob · GitHub Actions]</text>

  <!-- Connections from API to State DB / Graph / Object / Sources -->
  <g stroke="#444" stroke-width="1.4" fill="none" marker-end="url(#arr)" marker-start="url(#arr)">
    <line x1="350" y1="395" x2="170" y2="430"/>
    <line x1="430" y1="395" x2="370" y2="430"/>
    <line x1="540" y1="395" x2="610" y2="430"/>
  </g>
  <text x="240" y="412" font-size="9" fill="#444">SQL</text>
  <text x="380" y="412" font-size="9" fill="#444">Bolt / Cypher</text>
  <text x="600" y="412" font-size="9" fill="#444">FS / S3 API</text>

  <!-- Agent worker → Graph/Source/Storage -->
  <g stroke="#444" stroke-width="1.4" fill="none" marker-end="url(#arr)">
    <line x1="900" y1="395" x2="450" y2="430"/>
    <line x1="930" y1="395" x2="640" y2="430"/>
    <line x1="990" y1="395" x2="880" y2="430"/>
  </g>
  <text x="640" y="416" font-size="9" fill="#444">via choke-point query helpers</text>

  <!-- Reflection → State DB & Graph (read) -->
  <g stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr-faint)" stroke-dasharray="5 4">
    <line x1="1020" y1="500" x2="510" y2="500"/>
  </g>
  <text x="800" y="495" font-size="9" fill="#777">read event log + graph</text>

  <!-- Platform services row -->
  <g filter="url(#dropshadow)">
    <rect x="40" y="580" width="240" height="80" rx="10" fill="#f4f4f6" stroke="#666" stroke-width="1.5"/>
  </g>
  <text x="160" y="600" font-size="13" text-anchor="middle" font-weight="700" fill="#222">Identity provider</text>
  <text x="160" y="618" font-size="11" text-anchor="middle" fill="#444">OIDC · personas → claims</text>
  <text x="160" y="635" font-size="10" text-anchor="middle" fill="#555">Stamps PROV agent URIs on every approval</text>
  <text x="160" y="652" font-size="9" text-anchor="middle" fill="#777" font-style="italic">[Auth0 · Okta · Entra · Cognito]</text>

  <g filter="url(#dropshadow)">
    <rect x="300" y="580" width="240" height="80" rx="10" fill="#f4f4f6" stroke="#666" stroke-width="1.5"/>
  </g>
  <text x="420" y="600" font-size="13" text-anchor="middle" font-weight="700" fill="#222">Secret manager</text>
  <text x="420" y="618" font-size="11" text-anchor="middle" fill="#444">DB creds · LLM keys · per-project</text>
  <text x="420" y="635" font-size="10" text-anchor="middle" fill="#555">Resolved JIT; never persisted alongside state</text>
  <text x="420" y="652" font-size="9" text-anchor="middle" fill="#777" font-style="italic">[Vault · ASM · GCP SM · sops]</text>

  <g filter="url(#dropshadow)">
    <rect x="560" y="580" width="240" height="80" rx="10" fill="#f4f4f6" stroke="#666" stroke-width="1.5"/>
  </g>
  <text x="680" y="600" font-size="13" text-anchor="middle" font-weight="700" fill="#222">Policy engine</text>
  <text x="680" y="618" font-size="11" text-anchor="middle" fill="#444">tool allowlists · ACL eval</text>
  <text x="680" y="635" font-size="10" text-anchor="middle" fill="#555">Decisions cached per session</text>
  <text x="680" y="652" font-size="9" text-anchor="middle" fill="#777" font-style="italic">[OPA · Cedar · in-app rules]</text>

  <g filter="url(#dropshadow)">
    <rect x="820" y="580" width="240" height="80" rx="10" fill="#f4f4f6" stroke="#666" stroke-width="1.5"/>
  </g>
  <text x="940" y="600" font-size="13" text-anchor="middle" font-weight="700" fill="#222">Observability stack</text>
  <text x="940" y="618" font-size="11" text-anchor="middle" fill="#444">logs · traces · LLM telemetry</text>
  <text x="940" y="635" font-size="10" text-anchor="middle" fill="#555">Prompt/response capture, cost rollups</text>
  <text x="940" y="652" font-size="9" text-anchor="middle" fill="#777" font-style="italic">[OTel · Langfuse · Helicone · Datadog]</text>

  <g filter="url(#dropshadow)">
    <rect x="1080" y="580" width="180" height="80" rx="10" fill="#f4f4f6" stroke="#666" stroke-width="1.5"/>
  </g>
  <text x="1170" y="600" font-size="13" text-anchor="middle" font-weight="700" fill="#222">Sandbox</text>
  <text x="1170" y="618" font-size="11" text-anchor="middle" fill="#444">code exec · bash</text>
  <text x="1170" y="635" font-size="10" text-anchor="middle" fill="#555">Required for Bash / GX runs</text>
  <text x="1170" y="652" font-size="9" text-anchor="middle" fill="#777" font-style="italic">[gVisor · Firecracker · WASI]</text>

  <!-- Lines from app server / agent down to platform services -->
  <g stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr-faint)" stroke-dasharray="4 3">
    <line x1="350" y1="395" x2="200" y2="580"/>
    <line x1="430" y1="395" x2="400" y2="580"/>
    <line x1="540" y1="395" x2="640" y2="580"/>
    <line x1="630" y1="395" x2="900" y2="580"/>
    <line x1="900" y1="395" x2="1170" y2="580"/>
  </g>

  <!-- Boundary box: trust zone -->
  <g>
    <rect x="20" y="170" width="1240" height="500" rx="14" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="8 6"/>
    <text x="40" y="190" font-size="11" fill="#666" font-style="italic">— internal trust zone (VPC / private network) —</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 700)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#222">Legend</text>
    <rect x="0" y="10" width="14" height="14" fill="#dbe7ff" stroke="#1f4ea3"/><text x="22" y="22" font-size="11" fill="#222">Experience tier (browser / static)</text>
    <rect x="240" y="10" width="14" height="14" fill="#f1ecff" stroke="#5b3eb6"/><text x="262" y="22" font-size="11" fill="#222">App / orchestration tier</text>
    <rect x="460" y="10" width="14" height="14" fill="#ffe8d4" stroke="#c9711f"/><text x="482" y="22" font-size="11" fill="#222">Agent runtime (LLM-aware)</text>
    <rect x="700" y="10" width="14" height="14" fill="#cfeed8" stroke="#3a8c5a"/><text x="722" y="22" font-size="11" fill="#222">Stateful stores</text>
    <rect x="880" y="10" width="14" height="14" fill="#fff7e6" stroke="#c08a2a"/><text x="902" y="22" font-size="11" fill="#222">Scheduled / batch</text>
    <rect x="1040" y="10" width="14" height="14" fill="#f4f4f6" stroke="#666"/><text x="1062" y="22" font-size="11" fill="#222">Platform services</text>
  </g>

  <text x="40" y="755" font-size="10" fill="#777">Boxes are deployable units. Solid arrows = synchronous flow. Dashed arrows = async / scheduled or supporting flows.</text>
  <text x="40" y="770" font-size="10" fill="#777">Bracketed italic text shows alternative implementations a different deployment can substitute for the box without changing the surrounding shape.</text>
</svg>
