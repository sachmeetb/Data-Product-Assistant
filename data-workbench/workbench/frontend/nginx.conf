# SPA: serve static assets, fall back to index.html for client-side routes.
# The app calls the backend directly at http://localhost:8000 (api/client.ts),
# which the browser reaches via the backend container's published host port.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
