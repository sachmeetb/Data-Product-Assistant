apiVersion: workbench.platform/v1
id: azure_adls
displayName: Azure Data Lake Storage Gen2
adapterVersion: "0.1.0"
adapterKind: object_store
supportedServerVersions: "azure-storage-file-datalake>=12.0"

driver:
  package: azure-storage-file-datalake
  compatibility: ">=12.0"

credentialSchema: schemas/azure-adls-credentials.json

namespace:
  parts: [container, path]
  labels:
    container: Container
    path: Path Prefix

capabilities:
  connection: unsupported
  discovery: unsupported
  profiling: unsupported
  read_query: unsupported
  native_view: unsupported
  dbt_materialized: unsupported
  remediation: unsupported
  semantic_qa: unsupported
  transfer_source: unsupported
  transfer_target: unsupported
  lakehouse_export: unsupported
  lakehouse_source: unsupported
  volumetrics: unsupported
  code_assets: unsupported

notes: >
  Phase 3 object-store platform — registered so the connection model and UI
  can reference Azure ADLS Gen2 before the provider is implemented.
  Promotion to experimental requires: DataLakeServiceClient SessionProvider,
  URI-scheme dispatcher in export_table.py (abfss://), and ADR-14 decision.
  Managed Identity is the preferred credential path; avoid connection-string
  secrets with embedded storage account keys.
