server {
    # Cloud Run routes traffic to the container on $PORT (default 8080).
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: fall back to index.html for any unknown path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
