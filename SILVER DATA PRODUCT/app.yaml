command:
  - uvicorn
  - server:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"
env:
  - name: DATABRICKS_CATALOG
    value: "main"
  - name: DATABRICKS_SILVER_SCHEMA
    value: "banking_silver"
  - name: DATABRICKS_GOLD_SCHEMA
    value: "banking_gold"
  - name: DATABRICKS_LLM_MODEL
    value: "databricks-meta-llama-3-3-70b-instruct"
  - name: DATABRICKS_PUBLISHER_MODE
    value: "auto"
